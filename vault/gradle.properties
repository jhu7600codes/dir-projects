org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Only configure the subprojects a given task graph actually touches. This is
# what lets `gradle :core:test` succeed without an Android SDK installed --
# without it, Gradle configures every module in settings.gradle.kts up front,
# and AGP fails :app's configuration the moment it can't resolve an SDK, even
# though :app has nothing to do with the :core:test task.
org.gradle.configureondemand=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
