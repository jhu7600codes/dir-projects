name: lineagifier debug apk

on:
  push:
    paths:
      - "lineagifier/**"
      - ".github/workflows/lineagifier.yml"
  pull_request:
    paths:
      - "lineagifier/**"
      - ".github/workflows/lineagifier.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lineagifier
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: build debug apk
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: lineagifier-debug
          path: lineagifier/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
