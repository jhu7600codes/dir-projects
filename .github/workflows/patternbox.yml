name: patternbox apk

on:
  push:
    paths: ["patternbox/**", ".github/workflows/patternbox.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patternbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew && ./gradlew :core:test :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: patternbox-apk
          path: patternbox/app/build/outputs/apk/release/app-release.apk
