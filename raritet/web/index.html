<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Раритет</title>
<style>
html,body{margin:0;height:100%;background:#0f1215;color:#fff;font-family:Roboto,"Noto Sans",sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column}
.scr{display:none;flex:1;flex-direction:column;padding:16px;box-sizing:border-box;max-width:520px;width:100%;margin:0 auto}
.scr.on{display:flex}
h1{font-weight:300;font-size:40px;margin:24px 0 4px;color:#33b5e5;text-align:center}
.sub{color:#9e9e9e;text-align:center;font-size:14px;margin-bottom:28px;line-height:1.4}
button{background:#262d33;color:#fff;border:0;border-radius:2px;font:400 16px Roboto,sans-serif;padding:14px;margin:6px 0;text-transform:uppercase;letter-spacing:.5px}
button:active{background:#0099cc}
button.main{background:#0099cc}
button.main:active{background:#33b5e5}
.stats{display:flex;justify-content:space-around;margin-top:22px;color:#9e9e9e;font-size:13px;text-align:center}
.stats b{display:block;color:#fff;font-size:22px;font-weight:400}
#top{display:flex;justify-content:space-between;color:#9e9e9e;font-size:14px}
#bar{height:4px;background:#262d33;margin:10px 0 24px}
#fill{height:100%;background:#33b5e5;width:100%}
#fill.low{background:#ff4444}
#q{font-size:24px;line-height:1.3;margin-bottom:22px;min-height:62px}
#ans{background:#171c21;border:0;border-bottom:2px solid #33b5e5;color:#fff;font:400 20px Roboto,sans-serif;padding:12px 6px;outline:none;width:100%;box-sizing:border-box}
#fb{min-height:70px;margin-top:16px;font-size:16px;line-height:1.4}
.good{color:#99cc00}.bad{color:#ff4444}.mid{color:#ffbb33}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}
#list{flex:1;overflow:auto;margin:10px 0}
.it{background:#171c21;padding:10px 12px;margin-bottom:6px;font-size:14px;line-height:1.4}
.it .t{color:#9e9e9e;font-size:12px}
.it .p{float:right;font-size:18px}
#total{font-size:48px;font-weight:300;text-align:center;color:#33b5e5;margin:8px 0 0}
.hint{color:#9e9e9e;font-size:12px;text-align:center;margin-top:10px}
</style>
</head>
<body>

<div class="scr on" id="menu">
  <h1>Раритет</h1>
  <div class="sub">7 вопросов, 20 секунд на каждый.<br>Чем реже твой правильный ответ, тем больше очков.<br>Всё бесплатно, играй сколько хочешь.</div>
  <button class="main" id="bDaily">Игра дня</button>
  <button id="bEndless">Бесконечный режим</button>
  <div class="stats">
    <div><b id="sBest">0</b>лучший день</div>
    <div><b id="sStreak">0</b>дней подряд</div>
    <div><b id="sGames">0</b>игр</div>
  </div>
  <div class="hint" id="dailyNote"></div>
</div>

<div class="scr" id="play">
  <div id="top"><span id="num">1 / 7</span><span id="score">0 очков</span></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="q"></div>
  <input id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="твой ответ">
  <div class="row"><button id="bSkip">Пропуск</button><button class="main" id="bGo">Ответить</button></div>
  <div id="fb"></div>
</div>

<div class="scr" id="res">
  <div class="sub" id="resTitle" style="margin:8px 0 0"></div>
  <div id="total">0</div>
  <div class="sub" id="resSub" style="margin-bottom:8px"></div>
  <div id="list"></div>
  <div class="row"><button id="bShare">Поделиться</button><button class="main" id="bAgain">Ещё раз</button></div>
  <button id="bMenu">В меню</button>
</div>

if (hasDroid) { droid.system.orientation('portrait').catch(() => {}); droid.actionbar.hide().catch(() => {}) }
const buzz = (ms) => { if (hasDroid) droid.system.vibrate(ms).catch(() => {}); else if (navigator.vibrate) navigator.vibrate(ms) }

// storage: droid.prefs inside droid, localStorage elsewhere (the apk webview)
const store = {
  async get(k) { try { if (hasDroid) return await droid.prefs.get(k); return localStorage.getItem('raritet.' + k) } catch { return null } },
  async set(k, v) { try { if (hasDroid) return await droid.prefs.set(k, v); localStorage.setItem('raritet.' + k, v) } catch {} },

const norm = (s) => s.toLowerCase().replace(/ё/g, 'е').replace(/[«»"'`.,!?()\-–—_/\\]+/g, ' ').replace(/\s+/g, ' ').trim()
const tight = (s) => norm(s).replace(/ /g, '')
// latin typed on an english layout -> cyrillic guess, so "ria novosti" also finds "риа новости"
const LAT = { shch: 'щ', sch: 'щ', yo: 'е', zh: 'ж', kh: 'х', ts: 'ц', ch: 'ч', sh: 'ш', yu: 'ю', ya: 'я', a: 'а', b: 'б', v: 'в', g: 'г', d: 'д', e: 'е', z: 'з', i: 'и', y: 'ы', j: 'й', k: 'к', l: 'л', m: 'м', n: 'н', o: 'о', p: 'п', r: 'р', s: 'с', t: 'т', u: 'у', f: 'ф', h: 'х', c: 'к', w: 'в', x: 'кс', q: 'к' }
const translit = (s) => s.replace(/shch|sch|yo|zh|kh|ts|ch|sh|yu|ya|[a-z]/g, (m) => LAT[m])
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9
  let p = Array.from({ length: b.length + 1 }, (_, i) => i)
  for (let i = 1; i <= a.length; i++) {
    const c = [i]
    for (let j = 1; j <= b.length; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1))
    p = c
  }
  return p[b.length]
}

const PROMPTS = BANK.map(([q, raw]) => ({
  q,
  answers: raw.split(/,\s*(?=[^,=]+=\d)/).map((part) => {
    const [names, pct] = part.split('=')
    const all = names.split('|').map((n) => n.trim())
    return { name: all[0], keys: [...new Set(all.flatMap((n) => [tight(n), tight(translit(norm(n)))]))], pct: +pct }
  }),
}))

function match(prompt, input) {
  const t = tight(input), tr = tight(translit(norm(input)))
  if (!t) return null
  for (const a of prompt.answers) if (a.keys.includes(t) || a.keys.includes(tr)) return a
  // small typos are fine: 1 letter in words of 5+, 2 letters in words of 9+
  let best = null, bd = 9
  for (const a of prompt.answers) for (const k of a.keys) {
    const allow = k.length >= 9 ? 2 : k.length >= 5 ? 1 : 0
    if (!allow) continue
    for (const x of [t, tr]) { const d = lev(x, k); if (d <= allow && d < bd) { bd = d; best = a } }
  }
  return best
}
const points = (a) => (a ? Math.max(10, 100 - 2 * a.pct) : 0)

// seeded shuffle so everyone gets the same 7 prompts on the same day
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296 } }
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` }
function pick(seed) {
  const r = seed == null ? Math.random : rng(seed)
  const idx = PROMPTS.map((_, i) => i)
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]] }
  return idx.slice(0, 7).map((i) => PROMPTS[i])
}
const daySeed = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7)

let mode, round, at, total, log, timer, tEnd, locked
const show = (id) => { for (const s of document.querySelectorAll('.scr')) s.classList.toggle('on', s.id === id) }

async function menu() {
  show('menu')
  $('sBest').textContent = (await store.get('best')) || 0
  $('sStreak').textContent = (await store.get('streak')) || 0
  $('sGames').textContent = (await store.get('games')) || 0
  const last = await store.get('lastDay'), score = await store.get('dayScore')
  $('dailyNote').textContent = last === today() ? `сегодня ты набрал ${score}. можно переиграть, засчитается лучший результат` : 'новая игра дня каждый день в полночь'
}

function start(m) {
  mode = m
  round = m === 'daily' ? pick(daySeed(today())) : pick(null)
  at = 0; total = 0; log = []
  show('play'); next()
}

function next() {
  if (at >= round.length) return finish()
  locked = false
  const p = round[at]
  $('num').textContent = `${at + 1} / ${round.length}`
  $('score').textContent = `${total} очков`
  $('q').textContent = p.q
  $('ans').value = ''; $('ans').disabled = false
  $('fb').innerHTML = ''
  $('bGo').textContent = 'Ответить'
  $('ans').focus()
  tEnd = Date.now() + 20000
  clearInterval(timer)
  timer = setInterval(tick, 100); tick()
}

function tick() {
  const left = Math.max(0, tEnd - Date.now())
  $('fill').style.width = (left / 200) + '%'
  $('fill').classList.toggle('low', left < 5000)
  if (!left) submit(true)
}

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])

function submit(timeout) {
  if (locked) return next()
  locked = true
  clearInterval(timer)
  const p = round[at], raw = $('ans').value.trim()
  const a = timeout && !raw ? null : match(p, raw)
  const pts = points(a)
  total += pts
  log.push({ q: p.q, raw, a, pts, p })
  $('ans').disabled = true
  $('score').textContent = `${total} очков`
  const top = [...p.answers].sort((x, y) => y.pct - x.pct).slice(0, 3).map((x) => x.name).join(', ')
  if (a) {
    const cls = pts >= 80 ? 'good' : pts >= 50 ? 'mid' : 'bad'
    const word = pts >= 90 ? 'раритет!' : pts >= 70 ? 'редкий ответ' : pts >= 40 ? 'неплохо' : 'самый очевидный'
    $('fb').innerHTML = `<span class="${cls}">+${pts}, ${word}</span><br><span style="color:#9e9e9e">«${esc(a.name)}» сказали бы примерно ${a.pct}% игроков</span>`
    buzz(pts >= 80 ? 60 : 20)
  } else {
    $('fb').innerHTML = `<span class="bad">${raw ? 'такого ответа нет в базе' : timeout ? 'время вышло' : 'пропуск'}</span><br><span style="color:#9e9e9e">частые ответы: ${esc(top)}</span>`
    buzz(120)
  }
  $('bGo').textContent = at === round.length - 1 ? 'Итоги' : 'Дальше'
  at++
}

async function finish() {
  show('res')
  $('total').textContent = total
  $('resTitle').textContent = mode === 'daily' ? `игра дня, ${today()}` : 'бесконечный режим'
  $('resSub').textContent = `из ${round.length * 100} возможных`
  $('list').innerHTML = log.map((l) => {
    const rare = [...l.p.answers].sort((x, y) => x.pct - y.pct)[0]
    return `<div class="it"><span class="p ${l.pts >= 80 ? 'good' : l.pts ? 'mid' : 'bad'}">${l.pts}</span>${esc(l.q)}<br>` +
      `<span class="t">${l.a ? `твой ответ: ${esc(l.a.name)} (${l.a.pct}%)` : `твой ответ: ${esc(l.raw || '—')}`} · редкий вариант: ${esc(rare.name)}</span></div>`
  }).join('')
  const games = +((await store.get('games')) || 0) + 1
  await store.set('games', games)
  if (mode === 'daily') {
    const d = today(), last = await store.get('lastDay')
    if (last !== d) {
      const y = new Date(Date.now() - 864e5), yd = `${y.getFullYear()}-${String(y.getMonth() + 1).padStart(2, '0')}-${String(y.getDate()).padStart(2, '0')}`
      const streak = last === yd ? +((await store.get('streak')) || 0) + 1 : 1
      await store.set('streak', streak); await store.set('lastDay', d); await store.set('dayScore', total)
    } else if (total > +((await store.get('dayScore')) || 0)) await store.set('dayScore', total)
    if (total > +((await store.get('best')) || 0)) await store.set('best', total)
  }
}

function shareText() {
  const sq = log.map((l) => (l.pts >= 80 ? '■' : l.pts >= 40 ? '▣' : l.pts ? '□' : '·')).join('')
  return `Раритет ${mode === 'daily' ? today() : '∞'}: ${total}/${round.length * 100}\n${sq}`
}
async function share() {
  const t = shareText()
  try {
    if (hasDroid) { await droid.system.clipboard.write(t); droid.toast('скопировано') }
    else if (window.RaritetApp) RaritetApp.share(t)
    else if (navigator.share) await navigator.share({ text: t })
    else { await navigator.clipboard.writeText(t); $('bShare').textContent = 'Скопировано' }
  } catch {}
}

$('bDaily').onclick = () => start('daily')
$('bEndless').onclick = () => start('endless')
$('bGo').onclick = () => submit(false)
$('bSkip').onclick = () => { if (!locked) { $('ans').value = ''; submit(false) } else next() }
$('ans').onkeydown = (e) => { if (e.key === 'Enter') submit(false) }
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && locked && $('play').classList.contains('on') && document.activeElement !== $('ans')) next() })
$('bAgain').onclick = () => start(mode)
$('bMenu').onclick = menu
$('bShare').onclick = share
menu()
</script>
</body>
</html>
