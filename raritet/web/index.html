<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0f13">
<title>Раритет</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- home -->
<section class="scr on" id="home">
  <div class="bar">
    <div class="lang" id="langSw"><button data-l="ru">RU</button><button data-l="en">EN</button></div>
    <button class="iconbtn" id="toSettings" aria-label="settings"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z"/></svg></button>
  </div>
  <div class="logo">
    <svg class="gem" viewBox="0 0 96 96"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33b5e5"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs><path d="M48 8l34 22v36L48 88 14 66V30z" fill="url(#g)"/><path d="M48 8v80M14 30l68 36M82 30L14 66" stroke="#fff" stroke-opacity=".28" stroke-width="2"/><path d="M48 26l18 12v20L48 70 30 58V38z" fill="#fff" fill-opacity=".14"/></svg>
    <h1 data-t="title"></h1>
  </div>
  <div class="tag" data-t="tagline"></div>
  <div class="modes">
    <button class="mode daily" data-mode="daily"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2zm-2 8h14v10H5zm2 2v3h3v-3z"/></svg></span><span><b data-t="mDaily"></b><small id="dailySub"></small></span><span class="badge" id="dailyBadge"></span></button>
    <button class="mode" data-mode="endless"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.6 6.6c-1.5 0-2.9.6-4 1.6L12 10.6 9.4 8.2a5.6 5.6 0 0 0-8 0 5.4 5.4 0 0 0 0 7.6 5.6 5.6 0 0 0 8 0L12 13.4l2.6 2.4a5.6 5.6 0 0 0 8-7.6c-1-1-2.5-1.6-4-1.6zM8 14.4a3.6 3.6 0 0 1-5-5 3.6 3.6 0 0 1 5 0l2.6 2.5zm13 0a3.6 3.6 0 0 1-5 0L13.4 12 16 9.5a3.6 3.6 0 0 1 5 5z"/></svg></span><span><b data-t="mEndless"></b><small data-t="mEndlessSub"></small></span></button>
    <button class="mode" data-mode="blitz"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></span><span><b data-t="mBlitz"></b><small data-t="mBlitzSub"></small></span><span class="badge" id="blitzBadge"></span></button>
    <button class="mode" data-mode="zen"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9c0-.5 0-1-.1-1.4A5.5 5.5 0 0 1 13.4 3.1L12 3z"/></svg></span><span><b data-t="mZen"></b><small data-t="mZenSub"></small></span></button>
    <button class="mode gamer" data-mode="gamer"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 6h10a5 5 0 0 1 4.9 6l-1 4.6a2.6 2.6 0 0 1-4.6 1L14.6 15H9.4l-1.7 2.6a2.6 2.6 0 0 1-4.6-1L2.1 12A5 5 0 0 1 7 6zm1 3v2H6v2h2v2h2v-2h2v-2h-2V9zm7.5 1a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zm2.5 2.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg></span><span><b data-t="mGamer"></b><small data-t="mGamerSub"></small></span><span class="badge" id="gamerBadge"></span></button>
  </div>
  <div class="strip">
    <div class="chip"><b id="hStreak">0</b><span data-t="streak"></span></div>
    <div class="chip"><b id="hBest">0</b><span data-t="bestDay"></span></div>
    <div class="chip"><b id="hFound">0</b><span data-t="found"></span></div>
  </div>
  <div class="nav">
    <button id="toStats"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 20h4V10H4zm6 0h4V4h-4zm6 0h4v-7h-4z"/></svg><span data-t="stats"></span></button>
    <button id="toHow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 17h-2v-2h2zm2-7.3l-.9.9c-.7.7-1.1 1.4-1.1 2.4h-2v-.5c0-1.1.4-2.1 1.2-2.8l1.2-1.3A2 2 0 1 0 10 9H8a4 4 0 1 1 7 2.7z"/></svg><span data-t="how"></span></button>
  </div>
</section>

<!-- play -->
<section class="scr" id="play">
  <div class="hud">
    <button class="iconbtn" id="quit" aria-label="back"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg></button>
    <div class="meta"><div id="modeLbl"></div><b id="scoreLbl">0</b></div>
    <div class="ring" id="ring"><svg viewBox="0 0 64 64"><circle class="tr" cx="32" cy="32" r="28"/><circle class="pr" id="ringPr" cx="32" cy="32" r="28" stroke-dasharray="175.9" stroke-dashoffset="0"/></svg><span id="ringTxt">20</span></div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="qcard">
    <div class="cat" id="qNum"></div>
    <div class="q" id="qText"></div>
    <div class="hintline" id="hintLine"></div>
  </div>
  <div class="inp">
    <input id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
    <button class="go" id="go" aria-label="go"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 11h12.2l-5.6-5.6L12 4l8 8-8 8-1.4-1.4 5.6-5.6H4z"/></svg></button>
  </div>
  <div class="acts">
    <button id="skip" data-t="skip"></button>
    <button id="hint" data-t="hint"></button>
  </div>
  <div class="reveal" id="reveal">
    <div class="verdict"><span class="pts" id="vPts"></span><span class="lbl" id="vLbl"></span><span class="sub" id="vSub"></span></div>
    <div id="vList"></div>
    <button class="btn pri" id="next"></button>
  </div>
</section>

<!-- results -->
<section class="scr" id="res">
  <div class="rhead">
    <div class="mode-l" id="rMode"></div>
    <div class="total" id="rTotal">0</div>
    <div class="rank" id="rRank"></div>
    <div class="of" id="rOf"></div>
  </div>
  <div class="rlist" id="rList"></div>
  <div class="col">
    <div class="row"><button class="btn" id="share" data-t="share"></button><button class="btn pri" id="again" data-t="again"></button></div>
    <button class="btn" id="home2" data-t="home"></button>
  </div>
</section>

<!-- stats -->
<section class="scr" id="stats">
  <div class="bar"><button class="iconbtn back"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button><h2 data-t="stats"></h2><span style="width:40px"></span></div>
  <div class="scroll" id="statsBody"></div>
</section>

<!-- how to play -->
<section class="scr" id="how">
  <div class="bar"><button class="iconbtn back"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button><h2 data-t="how"></h2><span style="width:40px"></span></div>
  <div class="scroll" id="howBody"></div>
</section>

<!-- settings -->
<section class="scr" id="settings">
  <div class="bar"><button class="iconbtn back"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button><h2 data-t="settings"></h2><span style="width:40px"></span></div>
  <div class="scroll" id="setBody"></div>
</section>

<div class="fling" id="fling">
  <canvas id="flc"></canvas>
  <div class="flhud"><div class="flq" id="flQ"></div><div class="fld"><span id="flDist">0</span><small id="flUnit"></small></div><div class="fltap" data-t="tapSkip"></div></div>
  <div class="flsheet" id="flSheet"></div>
</div>
<div class="flash" id="flash"></div>
<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>

<script src="bank-ru.js"></script>
<script src="bank-en.js"></script>
<script src="bank-gamer.js"></script>
<script src="i18n.js"></script>
<script src="verify.js"></script>
<script src="fling.js"></script>
<script src="app.js"></script>
</body>
</html>
